[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ece-imdb-big-data"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pyspark==3.5.3", "requests>=2.32,<3", "kafka-python>=2.0,<3", "python-dotenv>=1.0,<2"]

[tool.setuptools.packages.find]
where = ["src"]
