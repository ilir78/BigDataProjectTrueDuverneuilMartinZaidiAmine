services:
  spark:
    build: .
    profiles: ["spark"]
    working_dir: /opt/project
    volumes:
      - ./:/opt/project
    environment:
      PYTHONPATH: /opt/project/src
      SPARK_DRIVER_MEMORY: 4g
      SPARK_MASTER: local[4]
      SPARK_SHUFFLE_PARTITIONS: 48
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: wiki-recentchange
      SPARK_CHECKPOINT_DIR: /opt/project/data/checkpoints/wiki-imdb
      WIKI_USER_AGENT: ${WIKI_USER_AGENT:-ece-imdb-big-data-course-project/1.0 (replace-with-contact@example.org)}
    depends_on:
      kafka:
        condition: service_healthy
  kafka:
    image: apache/kafka:3.8.0
    hostname: kafka
    container_name: imdb-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,INTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
